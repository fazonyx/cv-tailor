# ---------------------------------------------------------------------------
# What you do NOT master. This list is the backbone of the honesty rules:
# `python build.py` fails if any of these terms appears on a CV without a
# hedge ("ramp-up", "open to", "basics", "academic", "transferable", ...).
# Write them down once here; you can never forget one under deadline.
# ---------------------------------------------------------------------------
gaps:
  - term: Kubernetes
    hedge: "ramp-up"
  - term: Terraform
    hedge: "ramp-up"
  # Prefer distinctive terms: matching is case-insensitive, so "Go" would
  # fire on any sentence containing "go".
  - term: Golang
    hedge: "reading level"
  - term: Kafka
    hedge: "open to ramp up"
